<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>Panopto 개념 정리 설정</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Panopto 개념 정리 설정</h1>

      <label>
        OpenAI API Key
        <input id="openaiApiKey" type="password" autocomplete="off" placeholder="sk-...">
      </label>

      <label>
        OpenAI Model
        <input id="openaiModel" type="text" placeholder="gpt-5-mini">
      </label>

      <label>
        Notion Internal Integration Token
        <input id="notionApiKey" type="password" autocomplete="off" placeholder="ntn_... 또는 secret_...">
      </label>

      <label>
        Notion 부모 페이지 ID 또는 URL
        <input id="notionParentPageId" type="text" placeholder="Notion 페이지 URL을 붙여넣어도 됩니다">
      </label>

      <label>
        ChatGPT 프로젝트 URL
        <input id="chatgptProjectUrl" type="url" placeholder="https://chatgpt.com/... 프로젝트 링크">
      </label>

      <div class="actions">
        <button id="save" type="button">저장</button>
        <span id="status"></span>
      </div>

      <section>
        <h2>Notion 준비</h2>
        <p>Notion에서 새 통합을 만들고, 정리본을 넣을 페이지 오른쪽 위 메뉴에서 해당 통합을 초대해야 합니다.</p>
      </section>

      <section>
        <h2>ChatGPT 프로젝트 사용</h2>
        <p>API 비용 없이 쓰려면 ChatGPT에서 전용 프로젝트를 만든 뒤 그 프로젝트 URL을 저장하세요. 확장 프로그램이 대본과 요청문을 복사하고 해당 프로젝트를 열어줍니다.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
